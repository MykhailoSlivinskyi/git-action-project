# SFDC Authentication + using outputs within next step of the same job + error handling
name: SFDC Authentication using details
on: [push]

jobs:
  sfdc-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Authenticate to Salesforce
        id: sfdc_auth
        run: |
          response=$(curl --silent --fail --show-error https://login.salesforce.com/services/oauth2/token \
            -d "grant_type=password" \
            -d "client_id=${{ secrets.SFDC_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.SFDC_CLIENT_SECRET }}" \
            -d "username=${{ secrets.SFDC_DEV_USERNAME }}" \
            -d "password=${{ secrets.SFDC_DEV_PASSWORD }}")

          echo "Raw response: $response"

          access_token=$(echo "$response" | jq -r '.access_token')
          instance_url=$(echo "$response" | jq -r '.instance_url')
          error=$(echo "$response" | jq -r '.error // empty')
          error_description=$(echo "$response" | jq -r '.error_description // empty')

          echo "::set-output name=access_token::$access_token"
          echo "::set-output name=instance_url::$instance_url"
          echo "::set-output name=error::$error"
          echo "::set-output name=error_description::$error_description"

        env:
          # These should be stored in GitHub Secrets
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}

      - name: Validate access_token
        run: |
          access_token="${{ steps.sfdc_auth.outputs.access_token }}"
          if [ -z "$access_token" ] || [ "$access_token" = "null" ]; then
            echo "❌ Salesforce authentication failed"
            echo "Error: ${{ steps.sfdc_auth.outputs.error }} — ${{ steps.sfdc_auth.outputs.error_description }}"
            exit 1
          fi
          echo "✅ Auth successful — token received"
# only trigger on pull request closed events
on:
  pull_request:
    types: [ closed ]
    branches:
      - master
    paths:
      - 'force-app/**'
jobs:
  merge_job:
    # this job will only run if the PR has been merged
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy on ${{ vars.ENVIRONMENT_NAME }}
        uses: jawills/sf-deploy@v1.0
        with:
          SFDX_AUTH_URL`: ${{ secrets.SFDX_AUTH_URL }}
          DRY_RUN: false
          TEST_LEVEL: RunLocalTests
  close_job:
    # this job will only run if the PR has been closed without being merged
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo PR #${{ github.event.number }} has been closed without being merge